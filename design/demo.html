/* ══ demo.html — den ekte appen, uten database ══════════════════════
   Appen kommer ikke forbi oppstart uten Supabase, og da er det ingen
   ting å se på mens man jobber med utseendet. Denne sida henter
   markupen fra index.html, bytter ut Api med en som svarer fra en mal,
   og kjører ellers akkurat samme js/ui.js som telefonen gjør.

   Alt som rører serveren gjør ingenting her. Det som tegnes — program,
   «I dag», chatlista, Meg, øya og sveipet mellom fanene — er ekte.

   Den er ikke med i appen: den ligger i design/ og lastes aldri av
   index.html. Kjør den på http://localhost:4321/design/demo.html */

(async function demo() {
  // ── markupen, hentet fra den ekte sida så den aldri kommer i utakt ──
  const svar = await fetch("../index.html");
  const doc = new DOMParser().parseFromString(await svar.text(), "text/html");
  for (const s of doc.body.querySelectorAll("script")) s.remove();
  // Åpningsanimasjonen hører til oppstarten av den ekte appen og styres
  // av skriptet vi nettopp fjernet. Her ville den blitt liggende.
  const aap = doc.body.querySelector(".aapning"); if (aap) aap.remove();
  document.body.innerHTML = doc.body.innerHTML;

  // Høyden appen regner ut selv i index.html.
  const settHoyde = () => document.documentElement.style
    .setProperty("--app-h", (window.innerHeight || 800) + "px");
  settHoyde();
  addEventListener("resize", settHoyde);

  window.CONFIG = { ready: true, supabaseUrl: "", supabaseAnonKey: "", vapidPublicKey: "" };

  /* Omvisningen vises én gang per rolle, og flagget ligger lokalt. I
     demoen ville den lagt seg over alt man skulle se på, så den kommer
     bare med ?omvisning=1. */
  try {
    for (const rolle of ["leader", "member"]) {
      if (VALG.has("omvisning")) localStorage.removeItem("tk.omvisning." + rolle);
      else localStorage.setItem("tk.omvisning." + rolle, "1");
    }
  } catch { /* uviktig */ }

  await last("../js/templates.js");
  await last("../js/parse.js");
  lagApi();
  await last("../js/ui.js");

  function last(src) {
    return new Promise((ja, nei) => {
      const s = document.createElement("script");
      s.src = src; s.onload = ja; s.onerror = nei;
      document.head.appendChild(s);
    });
  }
})();

/* Demoen avgjoer et rombytte med en gang: her er det ingen base som
   holder styr paa to trinn. Flyttingen er den samme som i basen —
   begge ut av rommene sine foerst, saa inn igjen. */
function lukkRombytte(id, ja) {
  const i = rombytter.findIndex(x => x.id === id);
  if (i < 0) return;
  const x = rombytter[i];
  const maal = rom.find(r => r.id === x.rom);
  if (ja && maal) {
    const gammelt = rom.find(r => r.folk.includes(x.fraId));
    for (const r of rom) r.folk = r.folk.filter(p => p !== x.fraId && p !== x.tilId);
    maal.folk.push(x.fraId);
    if (x.tilId && gammelt) gammelt.folk.push(x.tilId);
  }
  rombytter.splice(i, 1);
}

/* Demoen avgjoer et bytte med en gang: her er det ingen base som
   holder styr paa to trinn. */
function lukkBytte(id, ja) {
  for (const k of kjoretoy) {
    const i = k.bytter.findIndex(x => x.id === id);
    if (i < 0) continue;
    const x = k.bytter[i];
    if (ja) {
      const fra = k.seter.find(s2 => s2.meg);
      const til = k.seter.find(s2 => s2.nr === x.nr);
      const gammel = fra ? fra.nr : null;
      k.seter = k.seter.filter(s2 => s2 !== fra && s2 !== til);
      k.seter.push({ nr: x.nr, id: "meg", meg: true, hvem: "Jonas Robstad" });
      if (til && gammel != null) k.seter.push({ ...til, nr: gammel });
    }
    k.bytter.splice(i, 1);
    return;
  }
}

/* Samme navnerekke som api.js: «Rom 201» ×4 blir 201–204, «Bil» ×3
   blir Bil 1, Bil 2, Bil 3. Ett stykk beholder navnet. */
function rekke(navn, antall) {
  const n = Math.max(1, Math.min(60, Number(antall) || 1));
  if (n === 1) return [navn];
  const m = String(navn).match(/^(.*?)(\d+)(\D*)$/);
  if (m) {
    const start = parseInt(m[2], 10);
    return Array.from({ length: n }, (_, k) =>
      m[1] + String(start + k).padStart(m[2].length, "0") + m[3]);
  }
  return Array.from({ length: n }, (_, k) => `${navn} ${k + 1}`);
}

      k.bytter.push({
        id: "b" + (k.bytter.length + 1), kjoretoy: kj, nr,
        status: paa ? "venter_andre" : "venter_leder",
        fraMeg: true, tilMeg: false, fra: "Jonas Robstad", til: paa ? paa.hvem : null
      });
      return Promise.resolve();
    },
    svarBytte: (id, ja) => { lukkBytte(id, ja); return Promise.resolve(); },
    avgjorBytte: (id, ja) => { lukkBytte(id, ja); return Promise.resolve(); },
    trekkBytte: id => { lukkBytte(id, false); return Promise.resolve(); },

    romkart: () => Promise.resolve({
      bytter: rombytter.map(x => ({ ...x })),
      rom: rom.map(r => ({
        id: r.id, navn: r.navn, plasser: r.plasser, sort: r.sort, sted: r.sted || null,
        folk: r.folk.map(id => {
          const p = FOLK.find(f => f.id === id) || {};
          return { id, navn: p.navn || "Ukjent", meg: id === "meg" };
        })
      })),
      alle: FOLK.map(p => ({
        id: p.id, navn: p.navn, leder: p.leder, meg: p.id === "meg",
        rom: (rom.find(r => r.folk.includes(p.id)) || {}).id || null
      }))
    }),
    /* Samme navnerekke som i api.js: «Rom 201» og fire blir 201–204. */
    nyttRom: (t, navn, plasser, sted, antall) => {
      for (const n of rekke(navn, antall)) {
        rom.push({ id: "r" + (rom.length + 1), navn: n, plasser,
          sort: rom.length + 1, folk: [], sted: sted || null });
      }
      return Promise.resolve();
    },
    endreRom: (id, navn, plasser, sted) => {
      const r = rom.find(x => x.id === id);
      if (r) { r.navn = navn; r.plasser = plasser; if (sted !== undefined) r.sted = sted || null; }
      return Promise.resolve();
    },
    settRomvalg: (t, v) => {
      if (v.fritt !== undefined) TUR.romFritt = v.fritt;
      if (v.godkjenn !== undefined) TUR.romGodkjenn = v.godkjenn;
      return Promise.resolve();
    },
    beOmRombytte: (romId, person) => {
      const r = rom.find(x => x.id === romId);
      if (!r) return Promise.reject(new Error("Fant ikke rommet."));
      if (r.folk.includes("meg")) return Promise.reject(new Error("Det er rommet ditt."));
      if (rombytter.some(x => x.fraMeg)) return Promise.reject(new Error("Du har alt en forespørsel som venter."));
      const mitt = rom.find(x => x.folk.includes("meg"));
      if (!person && r.folk.length >= r.plasser) return Promise.reject(new Error("Rommet er fullt."));
      if (person && !mitt) return Promise.reject(new Error("Du har ikke rom ennå. Spør om en ledig seng i stedet."));
      const p = FOLK.find(f => f.id === person);
      rombytter.push({
        id: "rb" + (rombytter.length + 1), rom: romId,
        status: person ? "venter_andre" : "venter_leder",
        fraMeg: true, tilMeg: false, fra: "Jonas Robstad", til: p ? p.navn : null,
        fraRom: mitt ? mitt.navn : null, fraId: "meg", tilId: person || null
      });
      return Promise.resolve();
    },
    svarRombytte: (id, ja) => { lukkRombytte(id, ja); return Promise.resolve(); },
    avgjorRombytte: (id, ja) => { lukkRombytte(id, ja); return Promise.resolve(); },
    trekkRombytte: id => { lukkRombytte(id, false); return Promise.resolve(); },
    fyllRom: () => {
      let n = 0;
      for (const p of FOLK) {
        if (rom.some(r => r.folk.includes(p.id))) continue;
        const ledig = rom.find(r => r.folk.length < r.plasser);
        if (!ledig) break;
        ledig.folk.push(p.id); n++;
      }
      return Promise.resolve(n);
    },

    // ── nødnummer ──
    kontakter: () => Promise.resolve({ liste: kontakter.map(c => ({ ...c })) }),
    nyKontakt: (t, f) => {
      kontakter.push({ id: "c" + (kontakter.length + 1), ...f, sort: (kontakter.length + 1) * 10 });
      return Promise.resolve();
    },
    endreKontakt: (id, f) => {
      const c = kontakter.find(x => x.id === id); if (c) Object.assign(c, f);
      return Promise.resolve();
    },
    slettKontakt: id => {
      const i = kontakter.findIndex(x => x.id === id); if (i >= 0) kontakter.splice(i, 1);
      return Promise.resolve();
    },

    // ── opprop ──
    opprop: () => Promise.resolve({
      runde: oppropRunde,
      folk: FOLK.map(p => ({ id: p.id, navn: p.navn, leder: p.leder, her: oppropHaker.has(p.id) }))
    }),
    nyttOpprop: (t, navn) => {
      oppropRunde = { id: "o1", navn: navn || "", lukket: false, created_at: new Date().toISOString() };
      oppropHaker = new Set();
      return Promise.resolve("o1");
    },
    settHake: (t, runde, person, her) => {
      if (her) oppropHaker.add(person); else oppropHaker.delete(person);
      return Promise.resolve();
    },
    lukkOpprop: () => { oppropRunde = null; oppropHaker = new Set(); return Promise.resolve(); },

    byttTurkode: () => { TUR.code = "NYKODE".slice(0, 6); return Promise.resolve(TUR.code); },
    slettRom: id => {
      const i = rom.findIndex(x => x.id === id); if (i >= 0) rom.splice(i, 1);
      return Promise.resolve();
    },
    settRom: (t, bruker, romId) => {
      for (const r of rom) r.folk = r.folk.filter(x => x !== bruker);
      if (romId) {
        const r = rom.find(x => x.id === romId);
        if (!r) return Promise.reject(new Error("Fant ikke rommet."));
        if (r.folk.length >= r.plasser) return Promise.reject(new Error("Rommet er fullt."));
        r.folk.push(bruker);
      }
      return Promise.resolve();
    },
    taSete: (kj, nr) => {
      const k = kjoretoy.find(x => x.id === kj);
      if (!k) return Promise.reject(new Error("Fant ikke kjøretøyet."));
      if (!k.fritt) return Promise.reject(new Error("Reiselederen fordeler plassene her."));
      if (k.seter.some(s2 => s2.nr === nr)) return Promise.reject(new Error("Den plassen ble tatt av noen andre."));
      const i = k.seter.findIndex(s2 => s2.meg); if (i >= 0) k.seter.splice(i, 1);
      k.seter.push({ nr, id: "meg", meg: true, hvem: "Jonas Robstad" }); return Promise.resolve();
    },
    slippSete: kj => {
      const k = kjoretoy.find(x => x.id === kj);
      if (k) { const i = k.seter.findIndex(s2 => s2.meg); if (i >= 0) k.seter.splice(i, 1); }
      return Promise.resolve();
    },
    nyttKjoretoy: (t, f) => {
      for (const navn of rekke(f.navn, f.antall)) {
        kjoretoy.push({ id: "k" + (kjoretoy.length + 1), ...f, navn, sort: kjoretoy.length + 1,
          dato: f.dato || null, bakerst: f.bakerst || 0,
          fritt: true, godkjenn: true, seter: [], bytter: [] });
      }
      return Promise.resolve();
    },
    endreKjoretoy: (id, f) => {
      const k = kjoretoy.find(x => x.id === id); if (k) Object.assign(k, f);
      return Promise.resolve();
    },
    slettKjoretoy: id => {
      const i = kjoretoy.findIndex(x => x.id === id); if (i >= 0) kjoretoy.splice(i, 1);
      return Promise.resolve();
    },
    settChatSkriving: (id, paa) => {
      const c = TUR.channels.find(x => x.id === id); if (c) c.bareLedere = paa;
      return Promise.resolve();
    },
    megTall: () => Promise.resolve({
      pakkTotalt: pakk.length + pakkEgen.length,
      pakkKrysset: pakk.concat(pakkEgen).filter(p => p.kryss).length,
      kjoretoy: kjoretoy.length,
      mineSeter: kjoretoy.filter(k => k.seter.some(s2 => s2.meg)).length,
      rom: rom.length,
      harRom: rom.some(r => r.folk.includes("meg")),
      byttSeter: kjoretoy.reduce((n, k) => n + k.bytter.filter(x =>
        (x.status === "venter_andre" && x.tilMeg) || x.status === "venter_leder").length, 0),
      byttRom: rombytter.filter(x =>
        (x.status === "venter_andre" && x.tilMeg) || x.status === "venter_leder").length,
      utenRom: FOLK.filter(p => !rom.some(r => r.folk.includes(p.id))).length
    }),
    lastVarselvalg: lover(undefined), varselvalg: () => ({ tur: "viktig", chat: {} }), varselNiva: () => "alt",
    settVarselNiva: lover(undefined),
    lesInnlogging: lover({ epost: "jonas@example.no", anonym: false }),
    erAnonym: () => false,
    minEpost: () => "jonas@example.no",
    sendKode: lover(undefined), bekreftKode: lover(undefined),
    koblePaaEpost: lover(undefined), bekreftKobling: lover(undefined),
    hentNavnFraTurer: lover(null), loggUt: lover(undefined), signOutLocal: lover(undefined),
    glemTur: ingen
  };
}
</script>
