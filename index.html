<!-- ============ ÅPNINGEN ============
     Ligger rett etter <body> og utenfor appen, så den er tegnet med en
     gang — ikke etter at ui.js har kjørt. -->
<div class="aapning" id="aapning" aria-hidden="true">
  <div class="ord">
    <svg class="merkeT" viewBox="0 0 24 24">
      <path class="T-stem" d="M11.5 8V21" pathLength="100" stroke="currentColor" stroke-width="2.9" stroke-linecap="butt" fill="none"/>
      <path class="T-arm" d="M5.8 10C7.1 9.6 8.1 8.8 11.4 8.05C13.7 7.5 15.6 5.9 17.8 4.85" pathLength="100" stroke="currentColor" stroke-width="2.9" stroke-linecap="round" fill="none"/>
      <circle class="T-dot" cx="17.83" cy="4.83" r="1.83" fill="#F06629"/>
    </svg>
    <span class="resten">rip<span class="mate">Mate</span></span>
  </div>
</div>
<script>
(function aapningen() {
  const a = document.getElementById("aapning");
  if (!a) return;

  // Én gang per oppstart. Laster appen seg selv på nytt fordi service
  // workeren fikk en ny versjon, skal den ikke spilles om igjen.
  let sett = false;
  try { sett = Boolean(sessionStorage.getItem("tm.sett")); } catch {}
  if (sett) {
    try { if (localStorage.getItem("tk.lastTrip")) document.documentElement.classList.add("skjelett"); } catch {}
    return a.remove();
  }
  try { sessionStorage.setItem("tm.sett", "1"); } catch {}

  // Har telefonen en tur fra før, står skjelettet av appen klart bak
  // logoen (se OPPSTART under). Da glir logoen rett over i det når den
  // er tegnet, og turen fylles inn der. Uten tur venter logoen på appen.
  let skjelett = false;
  try { skjelett = Boolean(localStorage.getItem("tk.lastTrip")); } catch {}
  if (skjelett) document.documentElement.classList.add("skjelett");

  const mindre = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const LENGDE = mindre ? 420 : 1180;   // så lenge tegningen varer
  const TAK = 4000;                     // og aldri lenger enn dette

  let ferdig = false;
  const avslutt = () => {
    if (ferdig) return;
    ferdig = true;
    a.classList.add("ut");
    setTimeout(() => a.remove(), 300);
  };
  a.addEventListener("click", avslutt);        // trykk for å hoppe over

  // Animasjonen skal aldri klippes av midt i, og appen skal aldri bli
  // stående ferdig bak den. Derfor: gå tegningen ut, og bli så liggende
  // til appen sier den har noe å vise. Taket er der fordi en feil også
  // skal fram — står det stille i fire sekunder, er det noe galt.
  //
  // Tegningen starter på første bilde som faktisk vises, ikke når siden
  // er lest inn. I iOS-appen holder WebKit igjen første tegning et par
  // sekunder mens appen starter, og da var logoen ferdig tegnet (og
  // skjelettet borte) før noe kom på skjermen. En skjult fane tegner
  // ingen bilder; der starter den med en gang. Reserven på seks sekunder
  // er bare for at åpningen aldri skal bli liggende.
  let start = 0, klar = false;
  addEventListener("tripmate:klar", () => {
    klar = true;
    if (start && !skjelett) setTimeout(avslutt, Math.max(0, LENGDE - (Date.now() - start)));
  }, { once: true });
  const spill = () => {
    if (start) return;
    start = Date.now();
    a.classList.add("spill");
    if (skjelett) { setTimeout(avslutt, LENGDE + 120); return; }
    if (klar) setTimeout(avslutt, LENGDE);
    setTimeout(() => { if (!klar) avslutt(); }, TAK);
  };
  if (document.hidden) spill();
  else requestAnimationFrame(() => requestAnimationFrame(spill));
  setTimeout(spill, 6000);
})();
</script>

<!-- ============ OPPSTART ============ -->
<section id="bootScreen" class="join">
  <!-- Skjelettet av appen, mens turen hentes. Vises bare når telefonen
       har en tur fra før (html.skjelett). Samme mål som appen, så ingenting
       hopper når innholdet kommer. -->

    <div class="sk-topp"><i class="sk sk-merke"></i><div class="sk-tekst"><i class="sk sk-l" style="width:46%"></i><i class="sk sk-s" style="width:30%"></i></div><i class="sk sk-rund"></i></div>

      <i class="sk sk-tittel"></i><i class="sk sk-s" style="width:38%"></i>
      <i class="sk sk-kort" style="height:96px"></i>
      <div class="sk-rad"><i class="sk sk-chip"></i><i class="sk sk-chip"></i><i class="sk sk-chip"></i></div>
      <div class="sk-liste">

        <div class="sk-punkt"><i class="sk sk-s" style="width:44px"></i><div class="sk-tekst"><i class="sk sk-l" style="width:54%"></i><i class="sk sk-s" style="width:46%"></i></div></div>
        <div class="sk-punkt"><i class="sk sk-s" style="width:44px"></i><div class="sk-tekst"><i class="sk sk-l" style="width:70%"></i><i class="sk sk-s" style="width:32%"></i></div></div>
      </div>
    </div>
    <div class="sk-faner"><i class="sk sk-fane"></i><i class="sk sk-fane"></i><i class="sk sk-fane"></i><i class="sk sk-fane"></i></div>
  </div>
  <div class="join-inner" style="text-align:center">
    <div class="mark" style="margin:0 auto 18px" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path class="stamme" d="M11.5 8V21"/><path d="M5.8 10C7.1 9.6 8.1 8.8 11.4 8.05C13.7 7.5 15.6 5.9 17.8 4.85"/><circle cx="17.83" cy="4.83" r="1.83" fill="var(--merke)" stroke="none"/></svg>
    </div>

<!-- ============ JOIN ============ -->
<section id="joinScreen" class="join" hidden>
  <div class="join-inner">
    <button class="tilbake" id="joinTilbake" hidden>&#8249; Tilbake</button>
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path class="stamme" d="M11.5 8V21"/><path d="M5.8 10C7.1 9.6 8.1 8.8 11.4 8.05C13.7 7.5 15.6 5.9 17.8 4.85"/><circle cx="17.83" cy="4.83" r="1.83" fill="var(--merke)" stroke="none"/></svg>
    </div>
    <h1>Bli med på turen</h1>
    <p class="lede">Skriv navnet ditt og turkoden du fikk av reiselederen.</p>
    <p id="joinKonto" class="kontolinje" hidden></p>

    <form id="joinForm" novalidate>
      <div class="field">
        <label for="fFirst">Fornavn</label>
        <input id="fFirst" maxlength="40" autocapitalize="words" autocorrect="off" spellcheck="false" name="first" autocomplete="given-name" required>
      </div>
      <div class="field">
        <label for="fLast">Etternavn</label>
        <input id="fLast" maxlength="40" autocapitalize="words" autocorrect="off" spellcheck="false" name="last" autocomplete="family-name" required>
      </div>
      <div class="field">
        <label for="fCode">Turkode</label>
        <input id="fCode" maxlength="12" name="code" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="SEKS TEGN" required>
      </div>
      <p class="err" id="joinErr" role="alert" hidden></p>
      <button class="btn primary big" type="submit" id="joinSubmit">Bli med på turen</button>
    </form>


    <p style="text-align:center;margin-top:20px;font-size:14.5px;color:var(--ink-2)">
      Er du reiseleder? <button type="button" class="linkbtn" data-sheet="newtrip">Lag en ny tur</button>
    </p>
  </div>
</section>

  <!-- Omvisningen. Den ligger over appen og peker på det den snakker

<script src="js/config.js?v=121"></script>
<script src="vendor/supabase.js?v=121"></script>
<script src="vendor/qrcode.js?v=121"></script>
<script src="js/templates.js?v=121"></script>
<script src="js/api.js?v=121"></script>
<script src="js/parse.js?v=121"></script>
<script src="js/ui.js?v=121"></script>
<script src="js/native.js?v=121"></script>
<script>

// Safari regner 100dvh litt feil, og da blir appen kortere enn skjermen —
// det er den hvite stripa under fanelinja. Vi måler i stedet det
// nettleseren faktisk viser, og setter høyden selv.
(function appHoyde() {
  let sist = 0;
  let tastatur = false;

  // I iOS-appen krymper iOS selve vinduet når tastaturet kommer opp, og
  // js/native.js setter tastatur-klassen. Da er innerHeight alltid riktig,
  // og ingenting av gjettingen under trengs.
  const nativ = Boolean(window.Capacitor && window.Capacitor.isNativePlatform &&
                        window.Capacitor.isNativePlatform());

  const sett = () => {
    const vv = window.visualViewport;
    const full = window.innerHeight || (vv ? vv.height : 0);
    if (!full) return;
    if (nativ) {
      if (Math.abs(full - sist) < 1) return;
      sist = full;
      document.documentElement.style.setProperty("--app-h", full + "px");
      return;
    }

    // Er tastaturet oppe, skal appen ende der tastaturet begynner. Er det
    // nede, fyller den skjermen. Ingenting imellom.
    const apent = Boolean(vv) && vv.height < full - 120;
    let h = Math.round(apent ? vv.height : full);

    // Et lite eller null-tall her ville gjort appen usynlig. Skjer det —
    // og iOS gjør av og til nettopp det midt i en animasjon — er det
    // bedre å bruke hele skjermen enn å vise en tom flate.
    if (h < full * 0.35) h = Math.round(full);

    // Tastaturet dekker feltet der hjemknappen ellers ville vært, så den
    // plassen skal ikke holdes av så lenge det står oppe.
    document.documentElement.classList.toggle("tastatur", apent);

    // Med tastaturet oppe flytter iOS utsnittet mens du blar. Da skal vi
    // ikke regne om noe: gjorde vi det, kjempet layouten mot fingeren din
    // og lista sto stille.
    if (apent === tastatur && Math.abs(h - sist) < 2) return;
    tastatur = apent;
    sist = h;
    document.documentElement.style.setProperty("--app-h", h + "px");
  };

  /* Når tastaturet kommer opp, skyver iOS hele siden oppover for å få
     feltet fram — men siden ligger fast, så den blir dratt ut av syne og
     etterlater en hvit flate. Vi flytter appen tilsvarende ned igjen.
     Dette er bare en forskyvning, ingen ny utregning av layouten, så det
     kommer ikke i veien for blaing slik høydemålingen gjorde. */
  const folgUtsnittet = () => {
    const vv = window.visualViewport;
    if (!vv || nativ) return;
    const y = Math.max(0, Math.round(vv.offsetTop));
    document.body.style.transform = y ? `translateY(${y}px)` : "";
  };

  sett();
  addEventListener("resize", sett);
  addEventListener("orientationchange", () => setTimeout(sett, 200));
  addEventListener("pageshow", sett);
  if (window.visualViewport) {
    visualViewport.addEventListener("resize", () => { sett(); folgUtsnittet(); });
    visualViewport.addEventListener("scroll", folgUtsnittet);
  }
})();

// Knip-zoom av: iOS respekterer ikke user-scalable aleine.
["gesturestart", "gesturechange", "gestureend"].forEach(n =>
  document.addEventListener(n, e => e.preventDefault(), { passive: false })
);
if ("serviceWorker" in navigator) {
  // Laster siden seg selv på nytt én gang når en ny versjon har tatt over,
  // slik at man aldri sitter igjen med gammel CSS eller gammel kode.
  let laster = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (laster) return;
    laster = true;
    location.reload();
  });

  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").then(reg => {
      // Et mislykket sjekk etter ny versjon er ikke verdt en feil i
      // konsollen — appen kjører videre på den versjonen den har.
      const sjekk = () => reg.update().catch(() => {});
      sjekk();
      // Se etter ny versjon hver gang appen hentes fram igjen.
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") sjekk();
      });
    }).catch(() => {});
  });
}
</script>
